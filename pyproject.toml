[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-weather-data-platform"
version = "1.0.0"
description = "Pipeline dữ liệu thời tiết Việt Nam: Open-Meteo, SQL Server (staging, dwh, mart), kiểm tra chất lượng, dự báo và dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "requests", "pyodbc"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
